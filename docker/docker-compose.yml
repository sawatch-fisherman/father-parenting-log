name: toto-ops

services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/var/www/html
    working_dir: /var/www/html

  webserver:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ../src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: toto_ops
      MYSQL_USER: toto_ops
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql

  node:
    image: node:lts-alpine
    user: "1000:1000"
    working_dir: /var/www/html
    volumes:
      - ../src:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
