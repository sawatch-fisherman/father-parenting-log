name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # docker/php/Dockerfile と同じ拡張に加え、テスト用の pdo_sqlite を有効化する
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl, zip, gd, exif, pcntl, pdo_sqlite
          # PHPStan はキャッシュが無い状態だと既定の 128M を超えるため上限を外す
          ini-values: memory_limit=-1
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # phpunit.xml がテスト接続を sqlite :memory: に固定しているため DB サービスは不要。
      # ただし EncryptCookies が APP_KEY を必要とするため、鍵だけは生成する。
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # ローカルの `composer check` と違い、CI では整形せず違反の検出だけを行う
      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # docker-compose.yml の node:lts-alpine に合わせる
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run type-check
